name: kotobaflow
description: "KotobaFlow — Offline-first Japanese vocabulary learning app for JLPT N5."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.1

  # Local database — Drift (typed SQLite ORM)
  drift: ^2.21.0
  sqlite3: ^3.9.0
  sqlite3_flutter_libs: ^0.5.26

  # File-system path helpers (required by Drift to locate the database file)
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Drift code generation
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - lib/core/database/openjlpt.sqlite
